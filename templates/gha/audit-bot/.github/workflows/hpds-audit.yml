name: hpds audit

on:
  schedule:
    # Weekly, Monday 06:17 UTC. Runs scheduled exactly on the hour are
    # often delayed or dropped by GitHub; an odd minute avoids the rush.
    - cron: "17 6 * * 1"
  pull_request:

# The bot upserts a PR comment and files/closes issues. `contents: write`
# is needed because GitHub's subscribers endpoint, which the watchers
# check reads, rejects the workflow token without it; nothing in this
# workflow pushes to the repository.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # Both steps need the token: `hpds audit` runs its GitHub checks
    # through gh, and the report step posts the findings.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the audit inspects branch ages and compares
          # rendered outputs against their sources.
          fetch-depth: 0

      # Installs the latest published hpds release. Until the first
      # v0.1.0 tag is published this step fails, because no release
      # exists yet; that is expected and documents itself.
      - name: Install hpds
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/StanfordHPDS/hpds-cli/releases/latest/download/hpds-installer.sh | sh

      # `hpds audit` exits 1 when it finds errors; expected here, because
      # reporting those findings is the whole point of this workflow. The
      # exit code is captured so the JSON always reaches the report step;
      # anything other than 0 or 1 (usage error, crash) still fails the job.
      # The report goes to RUNNER_TEMP, outside the checkout, so the audit
      # does not flag its own output as an untracked file.
      - name: Audit
        run: |
          status=0
          hpds audit --format json > "$RUNNER_TEMP/audit.json" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "hpds audit failed with exit code $status" >&2
            exit "$status"
          fi

      # On pull_request events this upserts the sticky findings comment;
      # on the weekly schedule it files one issue per new error finding
      # and closes issues for findings that no longer occur. Pull requests
      # from forks skip this step: their token is read-only, so it cannot
      # post comments or manage issues.
      - name: Report findings
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: hpds audit report-github --input "$RUNNER_TEMP/audit.json"

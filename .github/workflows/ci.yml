name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default: no job needs a token scope beyond reading
# repository contents.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Typos
        if: matrix.os == 'ubuntu-latest'
        uses: crate-ci/typos@v1.50.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # --no-fail-fast so one failing test binary does not hide failures
      # in the binaries after it; a red run reports everything at once.
      - name: Test
        run: cargo test --no-fail-fast --locked
      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
  dist-plan:
    name: dist plan (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Check dist config
        run: dist plan
  online-tests:
    name: online tests (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (online)
        run: cargo test --features online-tests
  container-runtime:
    name: container runtime (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
      - name: Build hpds
        run: cargo build --locked
      - name: Test container harness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/container-runtime -p 'test_*.py'
      - name: Resolve published hpds version
        id: published-hpds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          version=${tag#v}
          if [[ $tag != v$version || ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest release tag must have the form vX.Y.Z: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate generated containers
        env:
          PUBLISHED_HPDS_VERSION: ${{ steps.published-hpds.outputs.version }}
        run: |
          python3 tests/container-runtime/run.py \
            --engine all \
            --apptainer-build-as-root \
            --published-hpds-version "$PUBLISHED_HPDS_VERSION"

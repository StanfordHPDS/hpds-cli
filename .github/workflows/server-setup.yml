name: server setup (Linux container)

# Runs `hpds setup --profile server --yes` in a fresh systemd Ubuntu
# container and smoke-tests every component it installs. The job takes
# a while, so it runs only when the installers or the harness change.
# The pull_request and push path lists must match; tests/ci_workflow.rs
# checks that they do.
on:
  pull_request:
    paths:
      - "src/setup/**"
      - "src/install/**"
      - "src/tools/**"
      - "src/gitx/**"
      - "src/cli/setup.rs"
      - "src/cli/git.rs"
      - "src/cli/mod.rs"
      - "src/main.rs"
      - "src/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/server-setup/**"
      - ".github/workflows/server-setup.yml"
  push:
    branches: [main]
    paths:
      - "src/setup/**"
      - "src/install/**"
      - "src/tools/**"
      - "src/gitx/**"
      - "src/cli/setup.rs"
      - "src/cli/git.rs"
      - "src/cli/mod.rs"
      - "src/main.rs"
      - "src/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/server-setup/**"
      - ".github/workflows/server-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  server-setup:
    name: server setup (Linux container)
    # The server profile is x86_64 only, so this needs a native x86_64 runner.
    runs-on: ubuntu-24.04
    # Leaves room for the build plus both harness setup runs (50 and 20
    # minutes), so the harness reports its table before the job is killed.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build hpds
        run: cargo build --release --locked
      - name: Test server setup harness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/server-setup -p 'test_*.py'
      - name: Run server setup in a fresh container
        run: python3 tests/server-setup/run.py --hpds target/release/hpds
